      - 'tests/fixtures/vblank_clock_pinned.inc'
      - 'tests/fixtures/d3d12_prewarm_pinned.inc'
      - 'scripts/build_spatial_sdk.py'
      - '.github/workflows/native-graphics-windows.yml'
permissions:
  contents: read
jobs:
  compile-public-runtime:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Configure installed Visual Studio and Windows SDK environment
        shell: pwsh
        run: |
          $finder = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $finder -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ x64 tools are unavailable' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          $command = '""' + $vcvars + '" >nul && set"'
          $developmentEnvironment = & $env:ComSpec /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'vcvars64 failed' }
          $allowed = @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCTOOLSINSTALLDIR', 'VCINSTALLDIR', 'WINDOWSSDKDIR', 'WINDOWSSDKVERSION', 'VSCMD_ARG_TGT_ARCH', 'VSCMD_ARG_HOST_ARCH')
          foreach ($line in $developmentEnvironment) {
            $name, $value = $line -split '=', 2
            if ($name.ToUpperInvariant() -in $allowed) {
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (Test-Path (Join-Path $llvm 'clang-cl.exe')) {
            $llvm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Check required compiler baseline
        shell: pwsh
        run: |
          clang-cl --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --version
          ninja --version
      - name: Build pinned D3D12 EASU and RCAS runtime without game assets
        shell: pwsh
        run: |
          python scripts/build_spatial_sdk.py --allow-download --jobs 4 2>&1 | Tee-Object spatial-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify portable timing callback contract on Windows
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_portable_timing.py -v 2>&1 | Tee-Object timing-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_hd_source_cache.py -v 2>&1 | Tee-Object hd-source-cache-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build public Unicode texture helpers against the same SDK
        shell: pwsh
        run: |
          python -m native_port texture-tools 2>&1 | Tee-Object texture-tools.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify font atlas and launch contracts on Windows
        shell: pwsh
        run: |
          $prefixLine = Get-Content spatial-build.log | Where-Object { $_ -like 'SPATIAL_SDK_PREFIX=*' } | Select-Object -Last 1
          if (-not $prefixLine) { throw 'Built SDK prefix missing from build log' }
          $env:ASTER_TEST_UI_SDK_PREFIX = $prefixLine.Substring('SPATIAL_SDK_PREFIX='.Length)
          $env:ASTER_TEST_SAVE_SDK_PREFIX = $env:ASTER_TEST_UI_SDK_PREFIX
          python -m unittest discover -s tests -p test_runtime_save_slots.py -v 2>&1 | Tee-Object save-slot-native-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_save_slots.py -v 2>&1 | Tee-Object save-slot-storage-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_controls.py -v 2>&1 | Tee-Object controls-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_runtime_languages.py -v 2>&1 | Tee-Object language-native-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_ui_coverage_native.py -v 2>&1 | Tee-Object ui-native-coverage-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_texture_ui.py -v 2>&1 | Tee-Object ui-atlas-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_shader_prepare.py -v 2>&1 | Tee-Object shader-preparation-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_swapchain_retirement.py -v 2>&1 | Tee-Object swapchain-retirement-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_unchanged_surface_size.py -v 2>&1 | Tee-Object unchanged-surface-size-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_swap_aa.py -v 2>&1 | Tee-Object swap-aa-source-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_ui_launch.py -v 2>&1 | Tee-Object ui-launch-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_backend_quality_update.py -v 2>&1 | Tee-Object backend-quality-update-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_play_launcher.py -v 2>&1 | Tee-Object play-launcher-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_effects_diagnostics.py -v 2>&1 | Tee-Object effects-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_armed_effects_diagnostics.py -v 2>&1 | Tee-Object effects-index-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_effects_decision_budget.py -v 2>&1 | Tee-Object effects-decisions-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_d3d12_shader_prewarm.py -v 2>&1 | Tee-Object shader-prewarm-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_presenter_idle_notifications.py -v 2>&1 | Tee-Object presenter-idle-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_guest_vblank_clock.py -v 2>&1 | Tee-Object guest-vblank-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_scaled_pixel_centers.py -v 2>&1 | Tee-Object pixel-center-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_shader_preload.py -v 2>&1 | Tee-Object shader-preload-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_presenter_format_cache.py -v 2>&1 | Tee-Object presenter-format-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_async_submission.py -v 2>&1 | Tee-Object async-submission-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_startup_fullscreen.py -v 2>&1 | Tee-Object startup-fullscreen-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_runtime_evidence.py -v 2>&1 | Tee-Object runtime-evidence-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_prerequisites.py -v 2>&1 | Tee-Object prerequisites-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve compilation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-spatial-sdk-evidence
          path: |
            spatial-build.log
            texture-tools.log
            timing-test.log
            ui-atlas-test.log
            ui-launch-test.log
            effects-test.log
            effects-index-test.log
            effects-decisions-test.log
            shader-prewarm-test.log
            presenter-idle-test.log
            guest-vblank-test.log
            pixel-center-test.log
            shader-preload-test.log
            presenter-format-test.log
            async-submission-test.log
            startup-fullscreen-test.log
            runtime-evidence-test.log
            prerequisites-test.log
            .aster/tools/texture-tools/**/texture-tools.json
            .aster/tools/texture-tools/**/logs/*
            .aster/tools/spatial-sdk/**/logs/*.log
            .aster/tools/spatial-sdk/**/logs/*-failure.json
            .aster/tools/spatial-sdk/**/install/aster-spatial-sdk.json
          include-hidden-files: true
          retention-days: 14
