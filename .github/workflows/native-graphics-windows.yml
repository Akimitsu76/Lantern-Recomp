      - 'tests/fixtures/vblank_clock_pinned.inc'
      - 'tests/fixtures/d3d12_prewarm_pinned.inc'
      - 'scripts/build_spatial_sdk.py'
      - '.github/workflows/native-graphics-windows.yml'
permissions:
  contents: read
jobs:
  compile-public-runtime:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Python validation dependencies
        shell: pwsh
        run: |
          python -m pip install ".[hd,analysis]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure installed Visual Studio and Windows SDK environment
        shell: pwsh
        run: |
          python scripts/prepare_windows_env.py --github-env "$env:GITHUB_ENV"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check required compiler baseline
        shell: pwsh
        run: |
          clang-cl --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --version
          ninja --version
          python -m unittest discover -s tests -p test_windows_toolchain.py -v 2>&1 | Tee-Object compiler-environment-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore verified public SDK cache
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .aster/tools/spatial-sdk/*/install
            .aster/tools/spatial-sdk-sources
          key: windows-spatial-v1-${{ hashFiles('native_port/spatial_sdk.py', 'native_port/native_build.py', 'integrations/rexglue/patches/*.patch') }}
      - name: Build pinned D3D12 EASU and RCAS runtime without game assets
        shell: pwsh
        run: |
          python scripts/build_spatial_sdk.py --allow-download --jobs 4 2>&1 | Tee-Object spatial-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache the successfully verified public SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .aster/tools/spatial-sdk/*/install
            .aster/tools/spatial-sdk-sources
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Verify portable timing callback contract on Windows
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_portable_timing.py -v 2>&1 | Tee-Object timing-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_hd_source_cache.py -v 2>&1 | Tee-Object hd-source-cache-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build public Unicode texture helpers against the same SDK
        shell: pwsh
        run: |
          python -m native_port texture-tools 2>&1 | Tee-Object texture-tools.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify font atlas and launch contracts on Windows
        shell: pwsh
        run: |
          $prefixLine = Get-Content spatial-build.log | Where-Object { $_ -like 'SPATIAL_SDK_PREFIX=*' } | Select-Object -Last 1
          if (-not $prefixLine) { throw 'Built SDK prefix missing from build log' }
          $env:ASTER_TEST_UI_SDK_PREFIX = $prefixLine.Substring('SPATIAL_SDK_PREFIX='.Length)
          $env:ASTER_TEST_SAVE_SDK_PREFIX = $env:ASTER_TEST_UI_SDK_PREFIX
          $failedContracts = @()
          $contracts = @(
            [pscustomobject]@{ Pattern = 'test_runtime_save_slots.py'; Log = 'save-slot-native-test.log' }
            [pscustomobject]@{ Pattern = 'test_save_slots.py'; Log = 'save-slot-storage-test.log' }
            [pscustomobject]@{ Pattern = 'test_controls.py'; Log = 'controls-test.log' }
            [pscustomobject]@{ Pattern = 'test_runtime_languages.py'; Log = 'language-native-test.log' }
            [pscustomobject]@{ Pattern = 'test_ui_coverage_native.py'; Log = 'ui-native-coverage-test.log' }
            [pscustomobject]@{ Pattern = 'test_texture_ui.py'; Log = 'ui-atlas-test.log' }
            [pscustomobject]@{ Pattern = 'test_shader_prepare.py'; Log = 'shader-preparation-test.log' }
            [pscustomobject]@{ Pattern = 'test_swapchain_retirement.py'; Log = 'swapchain-retirement-test.log' }
            [pscustomobject]@{ Pattern = 'test_unchanged_surface_size.py'; Log = 'unchanged-surface-size-test.log' }
            [pscustomobject]@{ Pattern = 'test_swap_aa.py'; Log = 'swap-aa-source-test.log' }
            [pscustomobject]@{ Pattern = 'test_ui_launch.py'; Log = 'ui-launch-test.log' }
            [pscustomobject]@{ Pattern = 'test_backend_quality_update.py'; Log = 'backend-quality-update-test.log' }
            [pscustomobject]@{ Pattern = 'test_play_launcher.py'; Log = 'play-launcher-test.log' }
            [pscustomobject]@{ Pattern = 'test_effects_diagnostics.py'; Log = 'effects-test.log' }
            [pscustomobject]@{ Pattern = 'test_armed_effects_diagnostics.py'; Log = 'effects-index-test.log' }
            [pscustomobject]@{ Pattern = 'test_effects_decision_budget.py'; Log = 'effects-decisions-test.log' }
            [pscustomobject]@{ Pattern = 'test_d3d12_shader_prewarm.py'; Log = 'shader-prewarm-test.log' }
            [pscustomobject]@{ Pattern = 'test_presenter_idle_notifications.py'; Log = 'presenter-idle-test.log' }
            [pscustomobject]@{ Pattern = 'test_guest_vblank_clock.py'; Log = 'guest-vblank-test.log' }
            [pscustomobject]@{ Pattern = 'test_scaled_pixel_centers.py'; Log = 'pixel-center-test.log' }
            [pscustomobject]@{ Pattern = 'test_shader_preload.py'; Log = 'shader-preload-test.log' }
            [pscustomobject]@{ Pattern = 'test_presenter_format_cache.py'; Log = 'presenter-format-test.log' }
            [pscustomobject]@{ Pattern = 'test_async_submission.py'; Log = 'async-submission-test.log' }
            [pscustomobject]@{ Pattern = 'test_startup_fullscreen.py'; Log = 'startup-fullscreen-test.log' }
            [pscustomobject]@{ Pattern = 'test_runtime_evidence.py'; Log = 'runtime-evidence-test.log' }
            [pscustomobject]@{ Pattern = 'test_prerequisites.py'; Log = 'prerequisites-test.log' }
          )
          foreach ($contract in $contracts) {
            python -m unittest discover -s tests -p $contract.Pattern -v 2>&1 | Tee-Object $contract.Log
            if ($LASTEXITCODE -ne 0) { $failedContracts += $contract.Pattern }
          }
          if ($failedContracts.Count -gt 0) {
            Write-Output ("Failed contracts: " + ($failedContracts -join ', '))
            exit 1
          }
      - name: Preserve compilation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-spatial-sdk-evidence
          path: |
            spatial-build.log
            texture-tools.log
            timing-test.log
            compiler-environment-test.log
            *-test.log
            save-slot-native-test.log
            save-slot-storage-test.log
            controls-test.log
            language-native-test.log
            ui-atlas-test.log
            ui-launch-test.log
            effects-test.log
            effects-index-test.log
            effects-decisions-test.log
            shader-prewarm-test.log
            presenter-idle-test.log
            guest-vblank-test.log
            pixel-center-test.log
            shader-preload-test.log
            presenter-format-test.log
            async-submission-test.log
            startup-fullscreen-test.log
            runtime-evidence-test.log
            prerequisites-test.log
            .aster/tools/texture-tools/**/texture-tools.json
            .aster/tools/texture-tools/**/logs/*
            .aster/tools/spatial-sdk/**/logs/*.log
            .aster/tools/spatial-sdk/**/logs/*-failure.json
            .aster/tools/spatial-sdk/**/install/aster-spatial-sdk.json
          include-hidden-files: true
          retention-days: 14
